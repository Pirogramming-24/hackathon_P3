<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피로그래밍 - 세션 도우미</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #ddd6fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .dropdown {
            position: relative;
        }
        
        .dropdown-button {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .dropdown-button:hover {
            border-color: #4f46e5;
        }
        
        .dropdown-button.active {
            border-color: #4f46e5;
        }
        
        .dropdown-text {
            color: #9ca3af;
        }
        
        .dropdown-text.selected {
            color: #111827;
        }
        
        .dropdown-arrow {
            transition: transform 0.2s;
        }
        
        .dropdown-arrow.rotate {
            transform: rotate(180deg);
        }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-height: 250px;
            overflow-y: auto;
            z-index: 10;
        }
        
        .dropdown-menu.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .dropdown-item:hover {
            background: #f3f4f6;
        }
        
        .dropdown-item:first-child {
            border-radius: 10px 10px 0 0;
        }
        
        .dropdown-item:last-child {
            border-radius: 0 0 10px 10px;
        }
        
        .dropdown-item-title {
            font-weight: 500;
            color: #111827;
        }
        
        .dropdown-item-date {
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        
        .btn-secondary {
            background: #7c3aed;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">피로그래밍</div>
            <div class="subtitle">세션 도우미</div>
        </div>
        
        <div class="form-group">
            <label>세션 날짜 선택</label>
            <div class="dropdown">
                <button type="button" class="dropdown-button" id="dropdownButton">
                    <span class="dropdown-text" id="dropdownText">날짜를 선택해주세요</span>
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    {% for session in sessions %}
                    <div class="dropdown-item" data-id="{{ session.id }}" data-title="{{ session.title }}" data-date="{{ session.date }}">
                        <div class="dropdown-item-title">{{ session.title }}</div>
                        <div class="dropdown-item-date">{{ session.date }}</div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn btn-primary" id="participantBtn">참여자로 입장</button>
            <button class="btn btn-secondary" id="sessionerBtn">세션자로 입장</button>
        </div>
    </div>
    
    <script>
        let selectedSessionId = null;
        
        const dropdownButton = document.getElementById('dropdownButton');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const dropdownText = document.getElementById('dropdownText');
        const dropdownArrow = document.querySelector('.dropdown-arrow');
        const participantBtn = document.getElementById('participantBtn');
        const sessionerBtn = document.getElementById('sessionerBtn');
        
        // 드롭다운 토글
        dropdownButton.addEventListener('click', () => {
            dropdownMenu.classList.toggle('show');
            dropdownButton.classList.toggle('active');
            dropdownArrow.classList.toggle('rotate');
        });
        
        // 드롭다운 아이템 선택
        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                selectedSessionId = item.dataset.id;
                const title = item.dataset.title;
                const date = item.dataset.date;
                
                dropdownText.textContent = `${title} (${date})`;
                dropdownText.classList.add('selected');
                dropdownMenu.classList.remove('show');
                dropdownButton.classList.remove('active');
                dropdownArrow.classList.remove('rotate');
            });
        });
        
        // 외부 클릭시 드롭다운 닫기
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                dropdownMenu.classList.remove('show');
                dropdownButton.classList.remove('active');
                dropdownArrow.classList.remove('rotate');
            }
        });
        
        // 참여자 버튼
        participantBtn.addEventListener('click', () => {
            if (!selectedSessionId) {
                alert('세션 날짜를 선택해주세요');
                return;
            }
            window.location.href = `/participant/${selectedSessionId}/`;
        });
        
        // 세션자 버튼
        sessionerBtn.addEventListener('click', () => {
            if (!selectedSessionId) {
                alert('세션 날짜를 선택해주세요');
                return;
            }
            window.location.href = `/sessioner/${selectedSessionId}/`;
        });
    </script>
</body>
</html>
